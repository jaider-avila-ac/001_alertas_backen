# quien puede entrar a la bd en produccion (lo usa docker-compose.produccion.yml).
# todo lo que no este aqui queda rechazado.
#
# TIPO     BD       USUARIO        DIRECCION            METODO

# dentro del propio contenedor: migraciones (db/migrar.sh), probar.sh, copias y revisiones con docker compose exec.
# el socket solo existe dentro del contenedor: quien llega ahi ya es root del servidor (igual que la imagen oficial)
local      all      all                                 trust
host       all      all            127.0.0.1/32         scram-sha-256

# el backend: solo con ssl, solo desde la ip privada del servidor del backend y solo como alertas_app
# (el usuario que tiene RLS). cambiar 10.0.0.2 por la ip privada real
hostssl    alertas  alertas_app    10.0.0.2/32          scram-sha-256
