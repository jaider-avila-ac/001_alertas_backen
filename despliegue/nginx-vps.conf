# nginx del servidor (el de la maquina, no el de los contenedores): https y reparto por dominio.
# va en /etc/nginx/sites-available/alertas y se enlaza en sites-enabled.
# cambiar los tres dominios. los certificados los pone certbot (ver README.md)
#
#   app.midominio.com    -> front de las instituciones  (contenedor en 127.0.0.1:8081)
#   admin.midominio.com  -> superadmin                  (contenedor en 127.0.0.1:8082)
#   api.midominio.com    -> backend                     (contenedor en 127.0.0.1:8085)

# para el websocket: si el navegador pide upgrade se pasa, si no se cierra normal
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# limite de peticiones por ip al login (ademas del bloqueo que ya hace el backend)
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# todo lo que llegue por http se manda a https
server {
    listen 80;
    listen [::]:80;
    server_name app.midominio.com admin.midominio.com api.midominio.com;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------- api
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.midominio.com;

    ssl_certificate     /etc/letsencrypt/live/api.midominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.midominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # excel de importacion: el backend acepta hasta 6 MB
    client_max_body_size 7m;

    # el backend toma la ip real de aqui (server.forward-headers-strategy=native)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # notificaciones en vivo: el websocket necesita Upgrade y Connection, y no se corta por inactividad
    location /ws/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ~ ^/api/v1/(public/[^/]+/auth/login|superadmin/auth/login)$ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8085;
    }

    # el health solo desde la maquina (monitoreo), no desde internet
    location /actuator/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8085;
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
    }
}

# ---------------------------------------------------------------- front de las instituciones
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.midominio.com;

    ssl_certificate     /etc/letsencrypt/live/app.midominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.midominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}

# ---------------------------------------------------------------- superadmin
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.midominio.com;

    ssl_certificate     /etc/letsencrypt/live/admin.midominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.midominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # opcional: dejar entrar al panel solo desde ciertas ip (la oficina, la vpn)
    # allow 203.0.113.10;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
    }
}
