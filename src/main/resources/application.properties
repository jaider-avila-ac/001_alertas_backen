spring.application.name=alertas

# en local lee el .env, en docker llegan como variables de entorno
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8085}
server.error.include-message=never
spring.threads.virtual.enabled=true

# bd (se despliega aparte). el usuario es alertas_app, que tiene RLS
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:10}

# el esquema lo manejan los scripts de db/migration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50

# excel de importacion
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.jwt.secreto=${JWT_SECRET}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:480}
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173,http://localhost:5174}
app.login.max-intentos=5
# varios usuarios detras de la misma ip (la red del colegio)
app.login.max-intentos-ip=50
app.login.bloqueo-minutos=15

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# direccion del front de las instituciones, con ella se arma el enlace de cada colegio
app.url-front=${URL_FRONT:http://localhost:5173}

# primer superadmin, solo se usa si la tabla esta vacia
app.superadmin.usuario=${SUPERADMIN_USUARIO:}
app.superadmin.contrasena=${SUPERADMIN_CONTRASENA:}
app.superadmin.nombres=${SUPERADMIN_NOMBRES:}
